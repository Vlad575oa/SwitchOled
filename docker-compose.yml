services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: switcholed
      POSTGRES_PASSWORD: switcholed_pass
      POSTGRES_DB: switcholed_db
    volumes:
      - switcholed_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://switcholed:switcholed_pass@db:5432/switcholed_db
    depends_on:
      - db
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

volumes:
  switcholed_postgres_data:
